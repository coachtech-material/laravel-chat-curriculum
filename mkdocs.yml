site_name: PHP / Laravel 入門
site_description: プログラミングがはじめての方が、Laravel でチャットアプリを一からつくる入門教材です。COACHTECH の教材。
site_url: https://coachtech-material.github.io/laravel-chat-curriculum/

docs_dir: docs

theme:
  name: material
  language: ja
  logo: brand/logo.png
  favicon: brand/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon: {}

extra:
  generator: false

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - トップ: index.md
  - 第1部 準備編:
    - 第1章 学習の準備:
      - この教材でつくるもの: part-01/chapter-01/1-1-1.md
      - Google Chrome を用意する: part-01/chapter-01/1-1-2.md
      - GitHub アカウントをつくる: part-01/chapter-01/1-1-3.md
      - 開発環境をひらく: part-01/chapter-01/1-1-4.md
      - この教材の進め方: part-01/chapter-01/1-1-5.md
    - 第2章 エディタとターミナル:
      - エディタの見かた: part-01/chapter-02/1-2-1.md
      - ファイルとフォルダ: part-01/chapter-02/1-2-2.md
      - ターミナルに触れる: part-01/chapter-02/1-2-3.md
